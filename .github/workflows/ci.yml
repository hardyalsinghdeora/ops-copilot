name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -c requirements.lock -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - name: Unit tests (offline — hashing embeddings, scripted LLMs)
        run: pytest -q -m "not slow" --cov=ops_copilot --cov-report=term-missing:skip-covered
      - name: MCP stdio round-trip
        run: pytest -q -m slow
      - name: Retrieval eval (offline)
        env:
          OPS_COPILOT_EMBEDDING_PROVIDER: hashing
        run: |
          ops-copilot ingest
          ops-copilot eval --compare --output eval-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.python-version }}
          path: eval-report.json
