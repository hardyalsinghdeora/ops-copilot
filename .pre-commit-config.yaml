# Hooks run the tools from your dev install (pip install -c requirements.lock -e ".[dev]"),
# so their versions are the lockfile's, same as CI. Enable with: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false  # mypy checks the whole package, as configured in pyproject.toml
